[project]
name = "forge-lens"
version = "0.2.0"
description = "DataForge Query — library for loading, querying, and traversing Star Citizen DataForge XML"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Joni Hayes"}]
keywords = ["star citizen", "dataforge", "game data", "xml", "query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/jonigirl/forge-lens"
"Repository" = "https://github.com/jonigirl/forge-lens"
"Bug Tracker" = "https://github.com/jonigirl/forge-lens/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_lens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
